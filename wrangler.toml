name = "apple-refurb-tracker"
main = "dist/index.js"
compatibility_date = "2024-01-01"
account_id = "15bfe332876061d9a548a4f3d6835657"

# Runs every 30 minutes
[triggers]
crons = ["*/30 * * * *"]

# KV namespace stores seen product IDs (created via `wrangler kv namespace create`)
[[kv_namespaces]]
binding = "SEEN_PRODUCTS"
id = "224d2081abc042c89d2cfb850ae79fd9"

# Secrets (set via `wrangler secret put`, never hardcode):
#   RESEND_API_KEY  — Resend API key from https://resend.com/api-keys
#   NOTIFY_EMAIL_TO — recipient email address
